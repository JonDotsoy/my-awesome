topics_upstream: []                         # GitHub topics: none shown

# --- Summary ---
summary: >-
  Gives local dev servers stable, named .localhost URLs instead of port
  numbers. Prefix your dev command with `portless <name>` and it runs the app
  behind a local proxy with HTTPS/HTTP2, WebSocket/HMR support, subdomains,
  and per-branch URLs for git worktrees.
tagline: Replace port numbers with stable, named local URLs. For humans and agents.

# --- Features (extracted from README) ---
features:
  - Named .localhost URLs (e.g. `portless myapp next dev`)
  - HTTPS with HTTP/2 by default via a generated local CA
  - WebSocket / HMR through the proxy
  - Automatic PORT and --port/--host injection for common frameworks
  - Subdomains, custom TLDs, wildcard routing
  - Git worktree support (one subdomain per branch)
  - Monorepo / Turborepo support
  - LAN mode (.local names for other devices)
  - Tailscale and ngrok sharing
  - OS startup service (launchd, systemd, Task Scheduler)
  - "`doctor` command for diagnosing setup"

