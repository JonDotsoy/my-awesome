# --- Summary ---
summary: >-
  Browser-based tool that sends one prompt to several AI models and shows the
  streamed answers side by side, with live code previews plus speed, token and
  cost metrics. Works with your own API keys, kept in the browser, and with
  local model servers.
tagline: Compare AI models. Side by side.

# --- Features (extracted from the site) ---
features:
  - Same prompt to multiple models, streamed side by side
  - Live code previews
  - Speed, token and cost metrics; normalized battle analysis
  - Blind comparison mode
  - Synchronized scrolling
  - Advanced instructions (system prompt)
  - Battle history stored locally in the browser
  - Optional public sharing via unique link (prompt and successful results only)

