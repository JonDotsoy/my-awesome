# --- Summary ---
summary: >-
  Command-line orchestrator that runs coding agents (Pi, Claude, Codex, Cursor,
  Gemini) in bounded loops and managed workflows. It tracks typed tasks, records
  validation evidence and lands changes through protected Git worktrees.
tagline: Task-driven AI subagent orchestration

# --- Features (extracted from README) ---
features:
  - Agent runs via `yy pi`, `yy start` and aliases for several coding agents
  - Controlled iterations and `yy loop` workflows (inline steps or `flow.yaml`)
  - Typed task lifecycle with exact-base task worktrees and protected merge (`task`, `merge`)
  - Content-addressed validation evidence (`evidence run|status|await`)
  - Repository topology inspection and repair (`info`, `where`, `doctor workspace`)
  - Session continuity (continue, clone, branches, switch)
  - Stable machine output (`--format json|ndjson --raw`)
  - Installable agent skills (`yy skills install`) and delegation to YYLO Ledger and Benchmark

