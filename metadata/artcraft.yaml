# --- Summary ---
summary: >-
  Open-source studio for directing AI image and video generation with hands-on
  tools: 2D/3D compositing, image-to-3D mesh, character posing, camera
  blocking and background removal. Press coverage describes a wider effort to
  clone Adobe Creative Cloud and Microsoft Office apps, still in early alpha.
tagline: Capable tools for artists.

# --- Features (extracted from the product page) ---
features:
  - Image to Location (places virtual actors into real environments)
  - 3D compositing with depth from images, backdrops and props
  - 2D compositing with layers, drawing tools and background removal
  - Image to 3D mesh
  - Mixed assets (cutouts, worlds and meshes on one canvas)
  - Character posing and camera blocking
  - Browser-based studio with multiple generation models

