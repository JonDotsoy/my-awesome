# --- Summary ---
summary: >-
  A lightweight headless browser engine built for AI agents and scraping
  pipelines. It runs JavaScript with V8, exposes a Chrome DevTools Protocol
  server so existing Playwright and Puppeteer scripts can point at it, and
  can be self-hosted in Docker or used as a managed cloud.
tagline: The open source headless browser engine for AI agents and web scraping.

# --- Features (extracted from site and README) ---
features:
  - CDP server (`obscura serve`) compatible with Playwright and Puppeteer
  - JavaScript execution via V8 without Chromium
  - Sessions start in under 50 ms with no shared state between them
  - Memory use around 10x lower than Chrome (per the site)
  - CSS layout, screenshots, PDF export and screencasting
  - Stealth mode with per-session fingerprint randomization and tracker blocking
  - CLI for fetching pages (HTML, text, links, markdown) and parallel scraping
  - MCP server exposing browser tools to agents
  - HTTP/SOCKS5 proxy support
  - Managed cloud or self-hosting in a single Docker container

